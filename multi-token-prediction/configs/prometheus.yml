global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8443']

  - job_name: vllm
    metrics_path: /vllm/metrics
    bearer_token_file: /etc/prometheus/api_key
    scheme: http
    static_configs:
      - targets: ['127.0.0.1:8443']
