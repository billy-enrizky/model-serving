[project]
name = "multi-token-prediction"
version = "0.1.0"
description = "vLLM serving of Gemma 4 E2B-it with MTP speculative decoding"
requires-python = ">=3.10,<3.13"
dependencies = [
  "vllm==0.21.0",
  "fastapi>=0.118.0",
  "uvicorn[standard]>=0.34.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.7.1",
  "prometheus-client>=0.21.1",
  "python-dotenv>=1.0.1",
  "huggingface-hub>=0.27.1",
  "nvidia-ml-py>=12.560.30",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
bench = [
  "numpy>=2.2.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
