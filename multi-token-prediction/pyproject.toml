[project]
name = "multi-token-prediction"
version = "0.1.0"
description = "Gemma 4 E2B-it Multi-Token Prediction (speculative decoding) reference implementation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.7.0",
  "torchvision==0.22.0",
  "torchaudio==2.7.0",
  "transformers>=5.8.0",
  "accelerate>=1.2",
  "safetensors>=0.4",
  "fastapi>=0.118.0",
  "uvicorn[standard]>=0.34.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.7.1",
  "prometheus-client>=0.21.1",
  "python-dotenv>=1.0.1",
  "huggingface-hub>=0.27.1",
  "nvidia-ml-py>=12.560.30",
  "numpy>=2.0.0",
  "sentencepiece>=0.2",
  "tokenizers>=0.21",
  "pillow>=11",
]

[project.optional-dependencies]
bench = [
  "numpy>=2.2.1",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[tool.uv]
package = false
prerelease = "allow"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 100
target-version = "py310"
